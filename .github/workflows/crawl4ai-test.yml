name: Crawl4AI parse test

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL to crawl
        required: true
        default: https://csgraduates.com/constitution_principle/instruction/concepts/
  push:
    branches:
      - feat/crawl4ai-csgraduates-test
    paths:
      - requirements.txt
      - scripts/crawl_test.py
      - .github/workflows/crawl4ai-test.yml

permissions:
  contents: read

jobs:
  crawl:
    name: Crawl and export page
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Crawl4AI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Crawl target page
        env:
          TARGET_URL: ${{ inputs.url || 'https://csgraduates.com/constitution_principle/instruction/concepts/' }}
        run: |
          python scripts/crawl_test.py --url "$TARGET_URL" --output-dir artifacts/crawl

      - name: Add crawl summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/crawl/metadata.json ]; then
            echo '## Crawl4AI result' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/crawl/metadata.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload crawl artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl4ai-csgraduates-result
          path: artifacts/crawl/
          if-no-files-found: warn
          retention-days: 14
