name: Sharded csgraduates AI archive

on:
  push:
    branches:
      - run/csgraduates-full-archive
    paths:
      - requirements-ai.txt
      - scripts/ai_archive_core.py
      - scripts/crawl_site_ai_shard.py
      - scripts/shard_plan.py
      - scripts/shard_plan_balanced.py
      - scripts/merge_ai_shards.py
      - tests/test_ai_archive.py
      - tests/test_shard_plan.py
      - .github/workflows/csgraduates-sharded-archive.yml
  workflow_dispatch:
    inputs:
      chunk_size:
        description: Maximum pages per large study-resource shard
        required: true
        default: "35"

concurrency:
  group: csgraduates-full-archive
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Plan balanced archive shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      url_count: ${{ steps.plan.outputs.url_count }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    env:
      CHUNK_SIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.chunk_size || '35' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build balanced matrix from sitemap
        id: plan
        run: |
          mkdir -p artifacts
          python scripts/shard_plan_balanced.py \
            --base-url "https://csgraduates.com/" \
            --chunk-size "$CHUNK_SIZE" \
            --tiny-study-threshold 4 \
            --output artifacts/shard-plan.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload shard plan
        uses: actions/upload-artifact@v7
        with:
          name: csgraduates-ai-shard-plan-${{ github.run_id }}
          path: artifacts/shard-plan.json
          retention-days: 7

  test:
    name: Run AI archive tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python with pip cache
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ai.txt

      - name: Install lightweight dependencies
        run: pip install -r requirements-ai.txt

      - name: Run lean archive tests
        run: |
          python -m unittest tests.test_ai_archive -v
          python -m unittest tests.test_shard_plan -v

  archive:
    name: ${{ matrix.label }} · ${{ matrix.count }} pages
    needs:
      - prepare
      - test
    if: ${{ needs.prepare.result == 'success' && needs.test.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHARD_ID: ${{ matrix.id }}
      SHARD_LABEL: ${{ matrix.label }}
      SHARD_URLS_B64: ${{ matrix.urls_b64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python with pip cache
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ai.txt

      - name: Install archive dependencies and Chromium
        run: |
          pip install -r requirements-ai.txt
          pip install "playwright>=1.55,<2"
          python -m playwright install --with-deps chromium

      - name: Archive browser-rendered HTML and Markdown with live progress
        run: |
          python scripts/crawl_site_ai_shard.py \
            --urls-b64 "$SHARD_URLS_B64" \
            --shard-name "$SHARD_LABEL" \
            --output-dir artifacts/site \
            --article-selector .td-content \
            --concurrency 10 \
            --render-concurrency 4

      - name: Package shard ZIP
        run: |
          python - <<'PY'
          import os, shutil
          shutil.make_archive(
              f"artifacts/shard-{os.environ['SHARD_ID']}",
              "zip",
              root_dir="artifacts",
              base_dir="site",
          )
          PY

      - name: Add shard summary
        if: always()
        run: |
          echo "## $SHARD_LABEL" >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/site/shard-manifest.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data=json.load(open('artifacts/site/shard-manifest.json', encoding='utf-8'))
          print(
              f"Pages: {data['page_count']} | Success: {data['success_count']} | "
              f"Failed: {data['failure_count']} | Browser rendered: "
              f"{data.get('browser_render_success_count', 0)} | "
              f"Render failed: {data.get('browser_render_failure_count', 0)} | "
              f"Elapsed: {data['elapsed_seconds']}s"
          )
          PY
          fi

      - name: Upload shard archive
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: csgraduates-ai-shard-${{ matrix.id }}-${{ github.run_id }}
          path: artifacts/shard-${{ matrix.id }}.zip
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0

  merge:
    name: Merge AI archive with rendered HTML
    needs:
      - prepare
      - archive
    if: ${{ always() && needs.prepare.result == 'success' && needs.archive.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download all shard ZIPs
        uses: actions/download-artifact@v7
        with:
          pattern: csgraduates-ai-shard-*-${{ github.run_id }}
          path: artifacts/shards
          merge-multiple: true

      - name: Merge archive
        run: |
          python scripts/merge_ai_shards.py \
            --shards-dir artifacts/shards \
            --output-dir artifacts/site

      - name: Package final Windows-compatible ZIP
        run: |
          python - <<'PY'
          import shutil
          shutil.make_archive(
              "artifacts/csgraduates-ai-archive",
              "zip",
              root_dir="artifacts",
              base_dir="site",
          )
          PY

      - name: Add final summary
        if: always()
        run: |
          echo "## csgraduates AI archive" >> "$GITHUB_STEP_SUMMARY"
          echo "Discovered URLs: ${{ needs.prepare.outputs.url_count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Archive shards: ${{ needs.prepare.outputs.shard_count }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/site/manifest.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data=json.load(open('artifacts/site/manifest.json', encoding='utf-8'))
          print(f"Pages: {data['page_count']} | Success: {data['success_count']} | Failed: {data['failure_count']}")
          PY
          fi

      - name: Upload AI archive
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: csgraduates-ai-archive-${{ github.run_id }}
          path: artifacts/csgraduates-ai-archive.zip
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
