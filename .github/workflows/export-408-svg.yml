name: Export 408 SVG figures

on:
  push:
    branches:
      - feat/408-svg-export
    paths:
      - scripts/export_408_svgs.py
      - .github/workflows/export-408-svg.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Export and validate all 408 SVG figures
        run: |
          python scripts/export_408_svgs.py --output-dir artifacts/408-svg

      - name: Verify package contents
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path("artifacts/408-svg")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["years"] == list(range(2009, 2027)), manifest["years"]
          svgs = sorted(root.glob("*.svg"))
          assert len(svgs) == manifest["svg_count"] > 0
          for p in svgs:
              el = ET.parse(p).getroot()
              assert el.tag.rsplit("}", 1)[-1] == "svg", p
          print(f"validated {len(svgs)} SVG files across {manifest['year_count']} years")
          PY

      - name: Create ZIP
        run: |
          python - <<'PY'
          import shutil
          shutil.make_archive(
              "artifacts/408-svg-2009-2026",
              "zip",
              root_dir="artifacts",
              base_dir="408-svg",
          )
          PY

      - name: Summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/408-svg/manifest.json ]; then
            echo '## 408 SVG export' >> "$GITHUB_STEP_SUMMARY"
            python -c "import json; d=json.load(open('artifacts/408-svg/manifest.json',encoding='utf-8')); print('years=',d['year_count'],'svg=',d['svg_count'],'valid=',d['all_xml_valid'])" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload SVG ZIP
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: 408-svg-2009-2026-${{ github.run_id }}
          path: artifacts/408-svg-2009-2026.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
